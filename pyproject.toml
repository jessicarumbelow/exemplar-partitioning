[project]
name = "exemplar-partitioning"
version = "0.1.0"
description = "Training-free feature discovery for LLM activations via streaming exemplar partitioning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jessica Rumbelow" }]
keywords = ["interpretability", "mechanistic-interpretability", "sparse-autoencoder", "llm", "feature-discovery"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "huggingface-hub>=0.20",     # Dictionary.from_pretrained
    "transformers>=4.40",        # transformer-lens dependency for the quickstart
    "transformer-lens>=2.0",     # live-model activation extraction
]

[project.optional-dependencies]
# SAE-comparison baselines used by scripts/compare_sae.py and the SAEBench eval path.
sae = ["sae-lens>=0.5", "scikit-learn>=1.4"]
# Everything scripts/ needs: paper figures, Pile streaming, AxBench/SAEBench
# orchestration, wandb logging, partition labeling.
scripts = [
    "matplotlib>=3.8",
    "datasets>=2.18",
    "scikit-learn>=1.4",
    "wandb>=0.16",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "kaleido>=0.2",              # PNG export for sphere_voronoi.py
]
all = ["exemplar-partitioning[sae,scripts]"]

[project.urls]
Homepage = "https://github.com/jessicarumbelow/exemplar-partitioning"
Repository = "https://github.com/jessicarumbelow/exemplar-partitioning"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ep*"]
